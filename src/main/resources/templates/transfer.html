<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="fr"
      layout:decorate="~{layout}">
<head>
    <title>Transférer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main layout:fragment="content" class="transfer-container">
    <h2>Transférer</h2>

    <form th:action="@{/transfer}" method="post" class="transfer-form">
        <select name="receiverEmail" required>
            <option value="">Sélectionner une relation</option>
            <option th:each="email : ${relations}"
                    th:value="${email}"
                    th:text="${email}">
            </option>
        </select>

        <input type="text" name="description" placeholder="Description" required/>
        <input type="number" step="0.01" name="amount" placeholder="Montant en €" required/>

        <button type="submit" class="btn-pay">Payer</button>
    </form>


    <!-- Messages -->
    <p th:if="${success}" th:text="${success}" class="msg-success"></p>
    <p th:if="${error}" th:text="${error}" class="msg-error"></p>

    <!-- Tableau transactions -->
    <h3 class="transaction-title">Mes Transactions</h3>
    <table class="transaction-table">
        <thead>
        <tr>
            <th>Relations</th>
            <th>Description</th>
            <th>Montant</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tx : ${transactions}">
            <td th:text="${tx.receiver.username}"></td>
            <td th:text="${tx.description}"></td>
            <td th:text="${tx.amount + ' €'}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>

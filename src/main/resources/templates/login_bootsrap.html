<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card shadow p-4" style="width: 100%; max-width: 400px;">

    <!-- Bouton logo -->
    <div class="text-center mb-4">
        <button class="logo-btn">Pay My Buddy</button>
    </div>

    <!-- Formulaire -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        <div class="row  mx-auto my-auto">
            <p class="text-center">
                Nouveau Ici : <a th:href="@{/signup}" href="/signup">Inscription</a>
            </p>
        </div>
    </form>

    <!-- Message d'erreur -->
    <p th:if="${error}" th:text="${error}" class="text-danger mt-3 text-center"></p>
</div>

<!-- Bootstrap JS (optionnel si tu n’utilises pas d’interactions JS Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="fr"
      layout:decorate="~{layout}">
<head>
    <title>Transférer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main layout:fragment="content" class="transfer-container">
    <h2>Créditer votre compte </h2>

    <form th:action="@{/crediter}" method="post" class="transfer-form">
        <input type="number" step="0.01" name="montant" placeholder="Montant en €" required/>
        <button type="submit" class="btn-pay">Créditer</button>
    </form>
    <!-- Messages -->
    <p>Votre solde actuel est : <span th:text="${balance} + ' €'"></span></p>
    <p th:if="${error}" th:text="${error}" style="color:red"></p>
  </main>
</body>
</html>

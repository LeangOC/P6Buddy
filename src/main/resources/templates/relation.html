<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une relation - Pay My Buddy</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: calc(100vh - 60px);
            margin-top: 60px;
            text-align: center;
        }
        form {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
        }
        .message {
            margin-top: 15px;
            font-weight: bold;
        }

/* Barre de navigation commune */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 15px 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    font-family: Arial, sans-serif;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    z-index: 1000;
}
.navbar .logo {
    font-weight: bold;
    font-size: 18px;
    color: #000;
    text-decoration: none;
}
.navbar ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}
.navbar ul li a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
}
.navbar ul li a.active {
    color: #007bff; /* lien actif en bleu */
}
.navbar ul li a:hover {
    text-decoration: underline;
}
    </style>

</head>
<body>
<!-- Barre de navigation -->
<nav class="navbar">
    <a href="/home" class="logo">Pay My Buddy</a>
    <ul>
        <li><a href="/home">Home</a></li>
        <li><a href="#">Transférer</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="/relation" class="active">Ajouter relation</a></li>
        <li><a href="/login">Se déconnecter</a></li>
    </ul>
</nav>

<!-- Contenu principal -->
<div class="main-content">
    <h2>Chercher une relation</h2>
    <form th:action="@{/relation}" method="post">
        <input type="email" name="email" placeholder="Saisir une adresse mail" required>
        <button type="submit">Ajouter</button>
    </form>

    <p class="message" th:if="${message}" th:text="${message}"></p>
</div>
</body>
</html>
